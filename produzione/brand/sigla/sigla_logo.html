<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap">
<style>
*{margin:0}body{width:1080px;height:1920px;background:#0E0E0E;color:#fff;font-family:Montserrat,sans-serif;overflow:hidden;position:relative}
.a{position:absolute;left:0;right:0;top:700px;text-align:center;font-weight:900;font-size:150px;line-height:1}
.a span{display:inline-block;margin:0 10px}
.lgw{position:absolute;left:0;right:0;top:1000px;text-align:center}
.lg{font-weight:900;font-size:170px;letter-spacing:2px;display:inline-block;position:relative}
.dot{display:inline-block;width:52px;height:52px;border-radius:50%;background:#FF6A13;margin-left:10px}
.ring{position:absolute;border:8px solid #FF6A13;border-radius:50%}
</style></head><body>
<div class="a" id="a"><span>BRINDI</span><span style="color:#FF6A13">TU.</span></div>
<div class="lgw"><div class="lg" id="lg">GUIDO IO<span class="dot" id="dot"></span><div class="ring" id="ring"></div></div></div>
<script>
const q=new URLSearchParams(location.search),HIT=+(q.get('hit')||3.75),E=60/108/2;
const back=x=>{x=Math.min(Math.max(x,0),1);const c=1.3;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
window.render=t=>{
  const sp=document.querySelectorAll('#a span');[0,1].forEach(k=>{const s=back((t-k*2*E)/0.25);sp[k].style.transform=`scale(${Math.max(0,s)})`});
  const lg=document.getElementById('lg');const L=back((t-4*E)/0.3);lg.style.transform=`scale(${Math.max(0,L)})`;
  const dot=document.getElementById('dot');const d=back((t-HIT)/0.3);dot.style.transform=`scale(${Math.max(0,d)})`;
  const ring=document.getElementById('ring');const r=Math.max(0,(t-HIT)/0.6),rs=40+300*Math.min(1,r);
  const dr=dot.getBoundingClientRect(),lr=lg.getBoundingClientRect();
  ring.style.width=ring.style.height=rs+'px';ring.style.left=(dr.left-lr.left+26-rs/2)+'px';ring.style.top=(dr.top-lr.top+26-rs/2)+'px';ring.style.opacity=t<HIT?0:Math.max(0,1-r);
};
window.render(0);
</script></body></html>
